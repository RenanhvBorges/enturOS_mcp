[project]
name = "enturos-mcp"
version = "0.1.0"
description = "Servidor MCP para o EnturOS CRM (https://crm.enturos.com/api/v1/docs)"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.6.0,<2.0.0",
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.scripts]
enturos-mcp = "enturos_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["enturos_mcp"]

[tool.uv]
# Usa o cofre de certificados do sistema operacional em vez do cofre interno do uv.
# Necessário em máquinas Windows com antivírus/proxy corporativo que inspeciona HTTPS
# (o certificado injetado por eles não é reconhecido pelo cofre interno do uv).
native-tls = true
